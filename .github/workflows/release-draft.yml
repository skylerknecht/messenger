name: Draft Release

# Two triggers:
#   1. workflow_dispatch — creates the release branch + PR with a changelog.
#   2. push to release/* — refreshes the changelog, appending new commits
#      under an "Unreleased (post-branch)" section so you can keep pushing
#      to the release branch without losing visibility.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.4.1, 0.5.0, 0.6.0-rc.1)'
        required: true
        type: string

  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Version '${{ inputs.version }}' is not valid SemVer (e.g. 0.4.0 or 0.4.0-rc.1)"
            exit 1
          fi

      - name: Bump __version__
        run: |
          sed -i "s/^__version__ = .*/__version__ = '${{ inputs.version }}'/" messenger/__init__.py

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, subprocess, sys
          from datetime import datetime, timezone

          version = os.environ['VERSION']
          is_prerelease = '-' in version
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')

          AUTO_START = '<!-- AUTO-DRAFT START (from git log; refreshed each Draft; delete before final): -->'
          AUTO_END   = '<!-- AUTO-DRAFT END -->'

          HEADER = (
              "# Changelog\n"
              "All notable changes to this project will be documented in this file.\n\n"
              "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\n"
              "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n"
          )

          def last_final_tag():
              """Most recent tag matching vX.Y.Z (no prerelease suffix)."""
              try:
                  tags = subprocess.check_output(
                      ['git', 'tag', '--sort=-v:refname'], text=True).strip().splitlines()
                  for t in tags:
                      if re.match(r'^v\d+\.\d+\.\d+$', t):
                          return t
              except subprocess.CalledProcessError:
                  pass
              return None

          def git_log_since(tag):
              rng = f'{tag}..HEAD' if tag else 'HEAD'
              try:
                  return subprocess.check_output(
                      ['git', 'log', rng, '--pretty=- %s'], text=True).strip()
              except subprocess.CalledProcessError:
                  return ''

          def strip_auto_draft(text):
              pattern = r'<!-- AUTO-DRAFT START.*?<!-- AUTO-DRAFT END -->\n?'
              return re.sub(pattern, '', text, flags=re.DOTALL)

          def build_auto_draft(log):
              if not log:
                  return ''
              return f'{AUTO_START}\n{log}\n{AUTO_END}\n'

          path = 'CHANGELOG.md'
          content = open(path).read() if os.path.exists(path) else HEADER + "## [Unreleased]\n\n"
          if '## [Unreleased]' not in content:
              content = HEADER + "## [Unreleased]\n\n" + content

          m = re.search(r'(## \[Unreleased\]\s*\n)', content)
          before, rest = content[:m.end()], content[m.end():]
          n = re.search(r'\n(## \[)', rest)
          if n:
              unreleased_body = rest[:n.start() + 1]
              tail = rest[n.start() + 1:]
          else:
              unreleased_body = rest
              tail = ''

          unreleased_body = strip_auto_draft(unreleased_body).strip()

          last = last_final_tag()
          log = git_log_since(last)

          if is_prerelease:
              # RC: preserve [Unreleased] user bullets, refresh auto-draft, DO NOT create a version section
              parts = []
              if unreleased_body:
                  parts.append(unreleased_body)
              auto = build_auto_draft(log).rstrip()
              if auto:
                  parts.append(auto)
              new_unreleased = '\n\n'.join(parts)
              new_unreleased = ('\n' + new_unreleased + '\n\n') if new_unreleased else '\n'
              new_content = before + new_unreleased + tail
          else:
              # FINAL/PATCH/MINOR: promote [Unreleased] into new version section, reset [Unreleased] empty
              promoted = unreleased_body or log or '- No notable changes'
              if not (unreleased_body or log):
                  print(f'::warning::[Unreleased] and git log both empty — {version} will have placeholder notes', file=sys.stderr)
              new_section = f'## [{version}] - {date}\n\n{promoted}\n\n'
              new_content = before + '\n' + new_section + tail

          new_content = re.sub(r'\n{3,}', '\n\n', new_content).rstrip() + '\n'
          open(path, 'w').write(new_content)
          EOF

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -b release/${{ inputs.version }}
          git add messenger/__init__.py CHANGELOG.md
          git commit -m "publish ${{ inputs.version }}"
          git push -u origin release/${{ inputs.version }}

          if [[ "${{ inputs.version }}" == *-* ]]; then
            printf '%s\n' \
              "Triggered by @${{ github.actor }}. Pre-release: **${{ inputs.version }}**." \
              "" \
              "## Checklist" \
              "" \
              "- [ ] \`[Unreleased]\` section cleaned up (delete the auto-draft block, organize into \`### Added\` / \`### Changed\` / \`### Fixed\`)" \
              "- [ ] \`README.md\` updated where needed (Launch block banner shows new version, any docs referencing the old version)" \
              "- [ ] Ready to publish — after merge, run **Publish Release**" \
              > /tmp/pr-body.md
          else
            printf '%s\n' \
              "Triggered by @${{ github.actor }}. Release: **${{ inputs.version }}**." \
              "" \
              "## Checklist" \
              "" \
              "- [ ] \`## [${{ inputs.version }}]\` section in \`CHANGELOG.md\` reviewed and cleaned" \
              "- [ ] \`README.md\` updated where needed (Launch block banner shows new version, any docs referencing the old version)" \
              "- [ ] Ready to publish — after merge, run **Publish Release**" \
              > /tmp/pr-body.md
          fi

          gh pr create --title "publish ${{ inputs.version }}" --body-file /tmp/pr-body.md

  update-changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: meta
        run: |
          branch="${GITHUB_REF#refs/heads/release/}"
          echo "version=$branch" >> "$GITHUB_OUTPUT"

      - name: Refresh changelog with post-branch commits
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 <<'PYEOF'
          import os, re, subprocess, sys

          version = os.environ['VERSION']

          AUTO_START = '<!-- AUTO-DRAFT START (from git log; refreshed each Draft; delete before final): -->'
          AUTO_END   = '<!-- AUTO-DRAFT END -->'
          POST_START = '<!-- POST-BRANCH START (commits added after the release branch was cut): -->'
          POST_END   = '<!-- POST-BRANCH END -->'

          def strip_block(text, start_marker, end_marker):
              pattern = re.escape(start_marker) + r'.*?' + re.escape(end_marker) + r'\n?'
              return re.sub(pattern, '', text, flags=re.DOTALL)

          def git_log(range_spec):
              try:
                  return subprocess.check_output(
                      ['git', 'log', range_spec, '--pretty=- %s'], text=True).strip()
              except subprocess.CalledProcessError:
                  return ''

          def find_branch_base():
              """Find the initial 'publish X.Y.Z' commit that created this branch."""
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '--format=%H %s', '--reverse'], text=True).strip()
                  for line in out.splitlines():
                      sha, _, subject = line.partition(' ')
                      if subject.strip() == f'publish {version}':
                          return sha
              except subprocess.CalledProcessError:
                  pass
              return None

          path = 'CHANGELOG.md'
          if not os.path.exists(path):
              print('::warning::No CHANGELOG.md found, skipping update')
              sys.exit(0)

          content = open(path).read()

          base_sha = find_branch_base()
          if not base_sha:
              print(f'::warning::Could not find "publish {version}" commit, skipping post-branch update')
              sys.exit(0)

          post_log = git_log(f'{base_sha}..HEAD')
          if not post_log:
              print('No new commits since branch was cut, nothing to update')
              sys.exit(0)

          content = strip_block(content, POST_START, POST_END)

          post_block = f'{POST_START}\n{post_log}\n{POST_END}\n'

          is_prerelease = '-' in version
          if is_prerelease:
              anchor = '## [Unreleased]'
          else:
              anchor = f'## [{version}]'

          m = re.search(re.escape(anchor) + r'[^\n]*\n', content)
          if not m:
              print(f'::warning::Could not find "{anchor}" section in CHANGELOG.md')
              sys.exit(0)

          insert_pos = m.end()
          new_content = content[:insert_pos] + '\n' + post_block + '\n' + content[insert_pos:]
          new_content = re.sub(r'\n{3,}', '\n\n', new_content).rstrip() + '\n'

          open(path, 'w').write(new_content)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "Update changelog with post-branch commits"
            git push
          fi

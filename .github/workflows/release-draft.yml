name: Draft Release

# Manually dispatched. Branches from main, bumps __version__, promotes the
# [Unreleased] changelog section into ## [version] - date, and opens a PR.
# After merging that PR to main, run "Publish Release".
#
# Version must be major.minor.patch (no -rc / pre-release) and strictly
# greater than the latest published release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.4.2, 0.5.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be major.minor.patch (e.g. 0.4.2), no pre-release suffix"
            exit 1
          fi

      - name: Ensure version is greater than latest release
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')
          if [ -n "$latest" ]; then
            higher=$(printf '%s\n%s' "$latest" "${{ inputs.version }}" | sort -V | tail -1)
            if [ "$higher" = "$latest" ]; then
              echo "::error::Version ${{ inputs.version }} must be greater than latest release v$latest"
              exit 1
            fi
          fi

      - name: Update __version__
        run: |
          sed -i "s/^__version__ = .*/__version__ = '${{ inputs.version }}'/" messenger/__init__.py

      - name: Update README version badge
        run: |
          badge_version=$(echo "${{ inputs.version }}" | sed 's/-/--/g')
          sed -i "s|https://img.shields.io/badge/version-[^\"]*-blue|https://img.shields.io/badge/version-${badge_version}-blue|" README.md

      - name: Promote Unreleased to version section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, sys
          from datetime import datetime, timezone

          version = os.environ['VERSION']
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          path = 'CHANGELOG.md'
          content = open(path).read()

          m = re.search(r'(## \[Unreleased\]\s*\n)', content)
          if not m:
              print('::error::No [Unreleased] section found in CHANGELOG.md', file=sys.stderr)
              sys.exit(1)

          if f'## [{version}]' in content:
              print(f'::error::Section [{version}] already exists in CHANGELOG.md', file=sys.stderr)
              sys.exit(1)

          rest = content[m.end():]
          n = re.search(r'\n(## \[)', rest)
          if n:
              unreleased_body = rest[:n.start() + 1]
              tail = rest[n.start() + 1:]
          else:
              unreleased_body = rest
              tail = ''

          body = unreleased_body.strip()
          if not body:
              print('::warning::[Unreleased] section is empty', file=sys.stderr)
              body = '- No notable changes'

          new_content = (
              content[:m.start()]
              + '## [Unreleased]\n\n'
              + f'## [{version}] - {date}\n\n'
              + body + '\n\n'
              + tail
          )
          new_content = re.sub(r'\n{3,}', '\n\n', new_content).rstrip() + '\n'
          open(path, 'w').write(new_content)
          EOF

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -b release/${{ inputs.version }}
          git add messenger/__init__.py CHANGELOG.md README.md
          git commit -m "release ${{ inputs.version }}"
          git push -u origin release/${{ inputs.version }}

          printf '%s\n' \
            "Release: **${{ inputs.version }}** (triggered by @${{ github.actor }})." \
            "" \
            "## Checklist" \
            "" \
            "- [ ] \`## [${{ inputs.version }}]\` section in CHANGELOG.md reviewed and cleaned" \
            "- [ ] README.md updated where needed" \
            "- [ ] Ready to publish — after merge to main, run **Publish Release**" \
            > /tmp/pr-body.md

          gh pr create --title "release ${{ inputs.version }}" --body-file /tmp/pr-body.md

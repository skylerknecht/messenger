name: Publish Release

# Run this AFTER merging a release PR to main.
#
# Non-RC versions: tags HEAD, creates a GitHub Release with notes from
# the matching CHANGELOG.md section, and optionally publishes to PyPI.
#
# RC versions: publishes to PyPI only — no GitHub Release or tag.
#
# Must be dispatched on main.
#
# Backfill mode: iterates all existing v* tags, checks PyPI for each,
# and publishes any that are missing. Also creates GitHub Releases for
# tags that don't have one. Each version is built from its tag's commit.

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI (uncheck to only create a GitHub Release)'
        required: true
        type: boolean
        default: true
      backfill:
        description: 'Backfill all missing releases to PyPI and GitHub'
        required: true
        type: boolean
        default: false

permissions:
  contents: write   # tag push + release creation
  id-token: write   # PyPI trusted publishing (OIDC)

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  # ── Normal single-version publish ──────────────────────────────────
  publish:
    if: ${{ !inputs.backfill }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Refuse to publish outside main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Publish must run on main (got ${{ github.ref }}). Merge the release PR first."
            exit 1
          fi

      - name: Read version from messenger/__init__.py
        id: version
        run: |
          version=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" messenger/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from messenger/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected version: $version (RC: $([[ "$version" == *-rc* ]] && echo yes || echo no))"

      - name: Verify version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, sys

          version = os.environ['VERSION']
          errors = []

          readme = open('README.md').read()
          badge_match = re.search(r'img\.shields\.io/badge/version-(.*)-blue', readme)
          if not badge_match:
              errors.append('Could not find version badge in README.md')
          else:
              badge_version = badge_match.group(1).replace('--', '-')
              if badge_version != version:
                  errors.append(
                      f'README badge says {badge_version} but __init__.py says {version}'
                  )

          changelog = open('CHANGELOG.md').read()
          sections = re.findall(r'## \[([^\]]+)\]', changelog)
          recent = next((s for s in sections if s.lower() != 'unreleased'), None)
          if not recent:
              errors.append('No versioned section found in CHANGELOG.md')
          elif recent != version:
              errors.append(
                  f'Most recent changelog section is [{recent}] but __init__.py says {version}'
              )

          for e in errors:
              print(f'::error::{e}', file=sys.stderr)
          if errors:
              sys.exit(1)
          print(f'Version {version} is consistent across __init__.py, README.md, and CHANGELOG.md')
          EOF

      - name: Refuse if tag already exists
        if: steps.version.outputs.is_rc == 'false'
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.is_rc == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, sys

          version = os.environ['VERSION']
          content = open('CHANGELOG.md').read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, content, re.DOTALL)

          if not m:
              print(f'::error::No section [{version}] found in CHANGELOG.md', file=sys.stderr)
              sys.exit(1)

          notes = m.group(1).strip()
          if not notes:
              print(f'::error::Section [{version}] in CHANGELOG.md is empty', file=sys.stderr)
              sys.exit(1)

          open('release-notes.md', 'w').write(notes + '\n')
          EOF

      - name: Create and push tag
        if: steps.version.outputs.is_rc == 'false'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.is_rc == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Set up Python
        if: inputs.publish_to_pypi
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist and wheel
        if: inputs.publish_to_pypi
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Backfill: discover all version tags ────────────────────────────
  discover:
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List version tags
        id: tags
        run: |
          tags=$(git tag -l 'v*' --sort='version:refname' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Found tags: $tags"

  # ── Backfill: publish each missing version ─────────────────────────
  backfill:
    needs: discover
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ${{ fromJson(needs.discover.outputs.tags) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - name: Extract version from tag
        id: version
        run: |
          tag="${{ matrix.tag }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Processing $tag (version $version)"

      - name: Check if version exists on PyPI
        id: pypi
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/messenger-proxy/${{ steps.version.outputs.version }}/json")
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tag }} already on PyPI"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tag }} not on PyPI (status $status)"
          fi

      - name: Checkout tag
        if: steps.pypi.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        if: steps.pypi.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist and wheel
        if: steps.pypi.outputs.exists == 'false'
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release if missing
        if: steps.pypi.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ matrix.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          python3 <<'PYEOF'
          import os, re

          version = os.environ['VERSION']
          try:
              content = open('CHANGELOG.md').read()
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, content, re.DOTALL)
              notes = m.group(1).strip() if m else f'Release {version}'
          except Exception:
              notes = f'Release {version}'
          open('release-notes.md', 'w').write(notes + '\n')
          PYEOF

          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

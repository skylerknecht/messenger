name: Publish Release

# Run this AFTER merging a release PR to main.
#
# Non-RC versions: scans CHANGELOG.md for versioned sections (skipping
# [Unreleased] and any -rc entries) that don't have a GitHub Release yet,
# then tags and releases each one.
#
# RC versions: publishes to PyPI only — no GitHub Release or tag.
#
# Must be dispatched on main.

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI (uncheck to only create GitHub Releases)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # tag push + release creation
  id-token: write   # PyPI trusted publishing (OIDC)

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Refuse to publish outside main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Publish must run on main (got ${{ github.ref }}). Merge the release PR first."
            exit 1
          fi

      - name: Read version from messenger/__init__.py
        id: version
        run: |
          version=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" messenger/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from messenger/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected version: $version (RC: $([[ "$version" == *-rc* ]] && echo yes || echo no))"

      - name: Verify version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, sys

          version = os.environ['VERSION']
          errors = []

          readme = open('README.md').read()
          badge_match = re.search(r'img\.shields\.io/badge/version-([^-]*)-blue', readme)
          if not badge_match:
              errors.append('Could not find version badge in README.md')
          elif badge_match.group(1) != version:
              errors.append(
                  f'README badge says {badge_match.group(1)} but __init__.py says {version}'
              )

          changelog = open('CHANGELOG.md').read()
          sections = re.findall(r'## \[([^\]]+)\]', changelog)
          recent = next((s for s in sections if s.lower() != 'unreleased'), None)
          if not recent:
              errors.append('No versioned section found in CHANGELOG.md')
          elif recent != version:
              errors.append(
                  f'Most recent changelog section is [{recent}] but __init__.py says {version}'
              )

          for e in errors:
              print(f'::error::{e}', file=sys.stderr)
          if errors:
              sys.exit(1)
          print(f'Version {version} is consistent across __init__.py, README.md, and CHANGELOG.md')
          EOF

      - name: Configure git
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Create GitHub releases from changelog
        if: steps.version.outputs.is_rc == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'EOF'
          import re, subprocess, sys

          content = open('CHANGELOG.md').read()

          existing_tags = set(
              subprocess.check_output(['git', 'tag', '--list'], text=True).strip().split('\n')
          )

          created = 0
          for m in re.finditer(
              r'## \[([^\]]+)\][^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL
          ):
              ver = m.group(1)
              notes = m.group(2).strip()

              if ver.lower() == 'unreleased':
                  continue
              if '-rc' in ver:
                  continue

              tag = f'v{ver}'
              if tag in existing_tags:
                  continue
              if not notes:
                  print(f'::warning::Section [{ver}] is empty, skipping')
                  continue

              notes_file = f'/tmp/release-notes-{ver}.md'
              with open(notes_file, 'w') as f:
                  f.write(notes + '\n')

              subprocess.run(['git', 'tag', '-a', tag, '-m', tag], check=True)
              subprocess.run(['git', 'push', 'origin', tag], check=True)
              subprocess.run([
                  'gh', 'release', 'create', tag,
                  '--title', tag,
                  '--notes-file', notes_file,
              ], check=True)
              created += 1
              print(f'Created release {tag}')

          print(f'Done — created {created} release(s)')
          EOF

      - name: Set up Python
        if: inputs.publish_to_pypi
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist and wheel
        if: inputs.publish_to_pypi
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1

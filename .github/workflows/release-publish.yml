name: Publish Release

# Run this AFTER merging a release PR to main. Reads the version from
# messenger/__init__.py, extracts the matching ## [X.Y.Z] section from
# CHANGELOG.md, tags, creates a GitHub Release, and publishes to PyPI.
#
# Must be dispatched on main. Refuses if the tag already exists.

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI (uncheck to only tag + GitHub Release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # tag push + release creation
  id-token: write   # PyPI trusted publishing (OIDC)

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive   # bundled clients under builder/clients/* are needed for the wheel

      - name: Refuse to publish outside main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Publish must run on main (got ${{ github.ref }}). Merge the release PR first."
            exit 1
          fi

      - name: Read version from messenger/__init__.py
        id: version
        run: |
          version=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" messenger/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from messenger/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Refuse if tag already exists
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version and re-run Draft Release."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'EOF'
          import os, re, sys

          version = os.environ['VERSION']
          content = open('CHANGELOG.md').read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, content, re.DOTALL)

          if not m:
              print(f'::error::No section [{version}] found in CHANGELOG.md', file=sys.stderr)
              sys.exit(1)

          notes = m.group(1).strip()
          if not notes:
              print(f'::error::Section [{version}] in CHANGELOG.md is empty', file=sys.stderr)
              sys.exit(1)

          open('release-notes.md', 'w').write(notes + '\n')
          EOF

      - name: Create and push tag
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Set up Python
        if: inputs.publish_to_pypi
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist and wheel
        if: inputs.publish_to_pypi
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        # Requires PyPI Trusted Publishing configured for this repo:
        #   https://docs.pypi.org/trusted-publishers/
